<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0077CC">
<title>AYCE Conference Program</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--blue:#0077CC;--purple:#5A3E9C;--yellow:#F4D35E;--red:#E63946;--coral:#FF6B6B;--mint:#6ECF9D;--ink:#333;--paper:#fff;--stage:#e9e9ed}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fafafa}
body{padding:18px 12px}
#ayce-app{max-width:1180px;margin:0 auto}
.header{text-align:center;padding:5px 10px 18px}
.header h1{margin:0;color:var(--purple);font-size:clamp(21px,3vw,31px);letter-spacing:1px}
.header p{margin:6px 0 0;color:#666;font-size:12px;letter-spacing:2px;text-transform:uppercase}
.toolbar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;background:var(--blue);padding:11px;border-radius:10px 10px 0 0}
.toolbar button,.toolbar a{font:700 13px Arial,sans-serif;border:0;border-radius:5px;padding:9px 12px;background:#fff;color:var(--blue);text-decoration:none;cursor:pointer;transition:background .18s,color .18s}
.toolbar button:hover,.toolbar a:hover{background:var(--yellow);color:var(--ink)}
.toolbar button:disabled{opacity:.4;cursor:not-allowed}
.counter{color:#fff;font-size:13px;font-weight:700;min-width:104px;text-align:center}
.viewer-shell{display:flex;background:var(--stage);border:1px solid #d5d5da;min-height:430px;position:relative}
.thumbs{display:none;flex:0 0 142px;max-height:78vh;overflow:auto;background:#f7f7f8;border-right:1px solid #ddd;padding:9px}
.thumbs.open{display:block}
.thumb{display:block;width:100%;border:2px solid transparent;background:#fff;border-radius:5px;margin:0 0 9px;padding:5px;cursor:pointer;color:#444;font-size:11px}
.thumb.active{border-color:var(--purple);background:#f0ebf8}
.thumb canvas{display:block;width:100%;height:auto;margin-bottom:4px}
.stage{position:relative;flex:1;min-width:0;min-height:430px;padding:22px 12px;display:flex;align-items:center;justify-content:center;overflow:hidden;perspective:1800px}
.status{padding:42px 18px;text-align:center;color:#555;font-size:14px}
.book{position:relative;display:none;max-width:100%;transform-style:preserve-3d}
.spread{display:flex;align-items:stretch;position:relative;box-shadow:0 5px 22px rgba(0,0,0,.2);background:#fff}
.page{display:block;background:#fff;max-width:50%;height:auto;object-fit:contain}
.spread.single{justify-content:center;box-shadow:0 5px 22px rgba(0,0,0,.2)}
.spread.single .page{max-width:100%}
.spread.double .page{width:50%;height:auto}
.gutter{position:absolute;top:0;bottom:0;left:50%;width:10px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.10),rgba(255,255,255,.16),rgba(0,0,0,.10));z-index:2}
.flip-layer{position:absolute;top:0;bottom:0;width:50%;display:none;transform-style:preserve-3d;z-index:5;pointer-events:none}
.flip-layer.show{display:block}
.flip-layer.forward{left:50%;transform-origin:left center}
.flip-layer.backward{left:0;transform-origin:right center}
.face{position:absolute;inset:0;background:#fff;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 2px 12px rgba(0,0,0,.14)}
.face canvas{width:100%;height:100%;display:block}
.face.back{transform:rotateY(180deg)}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px;background:#f5f5f5;border:1px solid #ddd;border-top:0;border-radius:0 0 10px 10px;font-size:11px}
.footer strong{color:var(--purple);letter-spacing:.7px}
.footer span{color:#777}
@media(max-width:680px){
 body{padding:8px 3px}
 .toolbar{gap:5px;padding:9px 4px}
 .toolbar button,.toolbar a{font-size:11px;padding:9px 8px}
 .counter{width:100%;order:-1}
 .stage{min-height:320px;padding:12px 3px}
 .thumbs{flex-basis:100px;padding:6px}
 .footer{justify-content:center;text-align:center}
}
@media(prefers-reduced-motion:reduce){.toolbar button,.toolbar a{transition:none}}
</style>
</head>
<body>
<div id="ayce-app">
  <header class="header">
    <h1>AYCE CONFERENCE PROGRAM</h1>
    <p>Community. Connection. Career.</p>
  </header>
  <nav class="toolbar" aria-label="Program controls">
    <button id="toggle-thumbs" type="button">☷ Pages</button>
    <button id="prev" type="button" disabled>← Previous</button>
    <span class="counter" id="counter">Loading program…</span>
    <button id="next" type="button" disabled>Next →</button>
    <button id="zoom-out" type="button" title="Zoom out">−</button>
    <button id="zoom-in" type="button" title="Zoom in">+</button>
    <button id="fit" type="button">Fit</button>
    <button id="fullscreen" type="button" title="Full screen">⛶</button>
    <a id="download" href="./conference-program.pdf" download>↓ Download</a>
    <button id="print" type="button">Print</button>
  </nav>
  <div class="viewer-shell">
    <aside class="thumbs" id="thumbs" aria-label="Page thumbnails"></aside>
    <main class="stage" id="stage">
      <div class="status" id="status">Loading the AYCE conference program…</div>
      <div class="book" id="book">
        <div class="spread single" id="spread">
          <canvas class="page" id="left-page"></canvas>
          <canvas class="page" id="right-page" hidden></canvas>
          <div class="gutter" id="gutter" hidden></div>
        </div>
        <div class="flip-layer" id="flip-layer">
          <div class="face front"><canvas id="flip-front"></canvas></div>
          <div class="face back"><canvas id="flip-back"></canvas></div>
        </div>
      </div>
    </main>
  </div>
  <footer class="footer">
    <strong>AYCE | ASSOCIATION OF YOUTH AND CHILDREN IN EUROPE</strong>
    <span>Explore the program at your own pace.</span>
  </footer>
</div>
<script>
(() => {
  "use strict";
  const PDF_URL = "./conference-program.pdf";
  const pdfjs = window.pdfjsLib;
  if (!pdfjs) {
    document.getElementById("status").textContent = "The PDF viewer library could not load. Please refresh the page.";
    return;
  }
  pdfjs.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const $ = id => document.getElementById(id);
  const stage=$("stage"), book=$("book"), spread=$("spread"), status=$("status");
  const left=$("left-page"), right=$("right-page"), gutter=$("gutter");
  const layer=$("flip-layer"), front=$("flip-front"), back=$("flip-back");
  const ctx = c => c.getContext("2d");
  let pdf=null, viewIndex=0, views=[], mobile=false, zoom=1, fitMode=true;
  let busy=false, resizeTimer=null, thumbObserver=null;

  function isMobileLayout(){ return window.matchMedia("(max-width: 680px)").matches; }

  function buildViews(){
    mobile=isMobileLayout();
    const oldPage = currentAnchorPage();
    views=[{pages:[1],label:"1"}];
    if(mobile){
      for(let p=2;p<=47;p++) views.push({pages:[p],label:String(p)});
    }else{
      for(let p=2;p<=47;p+=2) views.push({pages:[p,p+1],label:p+"–"+(p+1)});
    }
    views.push({pages:[48],label:"48"});
    viewIndex=views.findIndex(v=>v.pages.includes(oldPage));
    if(viewIndex<0) viewIndex=0;
  }

  function currentAnchorPage(){
    if(!views.length) return 1;
    return views[Math.max(0,Math.min(viewIndex,views.length-1))].pages[0];
  }

  function pageScale(pageObj, targetWidth, targetHeight){
    const base=pageObj.getViewport({scale:1});
    if(fitMode){
      const heightLimit=Number.isFinite(targetHeight)?targetHeight:Infinity;
      return Math.min(targetWidth/base.width,heightLimit/base.height,2.2);
    }
    return zoom;
  }

  async function paint(pageNumber, canvas, targetWidth, targetHeight){
    const p=await pdf.getPage(pageNumber);
    const scale=pageScale(p,targetWidth,targetHeight);
    const vp=p.getViewport({scale});
    const ratio=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.max(1,Math.floor(vp.width*ratio));
    canvas.height=Math.max(1,Math.floor(vp.height*ratio));
    canvas.style.width=vp.width+"px";
    canvas.style.height=vp.height+"px";
    await p.render({canvasContext:ctx(canvas),viewport:vp,
      transform:[ratio,0,0,ratio,0,0]}).promise;
    return {width:vp.width,height:vp.height};
  }

  function availablePageBox(double){
    const availableWidth=Math.max(160,stage.clientWidth-30);
    const availableHeight=Math.max(180,stage.clientHeight-44);
    return {
      width: double ? Math.min(availableWidth/2,500) : Math.min(availableWidth,570),
      height: availableHeight
    };
  }

  async function renderView(){
    if(!pdf) return;
    const view=views[viewIndex];
    const double=view.pages.length===2;
    const pageBox=availablePageBox(double);
    const pageWidth=pageBox.width;
    book.style.display="block";
    layer.className="flip-layer";
    layer.style.transition="none";
    layer.style.transform="rotateY(0deg)";
    right.hidden=!double;
    gutter.hidden=!double;
    spread.className="spread "+(double?"double":"single");
    const first=await paint(view.pages[0],left,pageWidth,pageBox.height);
    if(double){
      await paint(view.pages[1],right,pageWidth,pageBox.height);
      book.style.width=(first.width*2)+"px";
      spread.style.width=(first.width*2)+"px";
      spread.style.height=first.height+"px";
      gutter.hidden=false;
    }else{
      book.style.width=first.width+"px";
      spread.style.width=first.width+"px";
      spread.style.height=first.height+"px";
      gutter.hidden=true;
    }
    $("counter").textContent="PAGE "+view.label+" OF 48";
    $("prev").disabled=viewIndex===0;
    $("next").disabled=viewIndex===views.length-1;
    status.hidden=true;
    updateActiveThumb();
  }

  async function animateSpread(nextIndex, direction){
    // Deliberately use an immediate spread change instead of the heavy 3D page-turn effect.
    busy=true;
    try{
      viewIndex=nextIndex;
      await renderView();
    }finally{
      busy=false;
    }
  }

  async function go(delta){
    if(!pdf||busy) return;
    const target=Math.max(0,Math.min(views.length-1,viewIndex+delta));
    if(target===viewIndex) return;
    const direction=target>viewIndex?1:-1;
    await animateSpread(target,direction);
  }

  function updateActiveThumb(){
    document.querySelectorAll(".thumb").forEach(b=>{
      b.classList.toggle("active",Number(b.dataset.view)===viewIndex);
    });
  }

  function buildThumbs(){
    const panel=$("thumbs");
    panel.replaceChildren();
    if(thumbObserver) thumbObserver.disconnect();
    thumbObserver=new IntersectionObserver(entries=>{
      entries.forEach(async entry=>{
        if(!entry.isIntersecting) return;
        const btn=entry.target;
        const n=Number(btn.dataset.page);
        const c=btn.querySelector("canvas");
        if(c.dataset.done) return;
        c.dataset.done="1";
        try{await paint(n,c,68);}catch(e){console.warn("Thumbnail render failed",n,e);}
        thumbObserver.unobserve(btn);
      });
    },{root:panel});
    for(let p=1;p<=48;p++){
      const b=document.createElement("button");
      b.type="button"; b.className="thumb"; b.dataset.page=p;
      const c=document.createElement("canvas");
      const label=document.createElement("span");
      label.textContent="Page "+p;
      b.append(c,label);
      b.addEventListener("click",async()=>{
        if(busy) return;
        const target=views.findIndex(v=>v.pages.includes(p));
        if(target>=0){viewIndex=target;await renderView();}
      });
      panel.append(b);
      thumbObserver.observe(b);
    }
  }

  $("prev").addEventListener("click",()=>go(-1));
  $("next").addEventListener("click",()=>go(1));
  $("zoom-in").addEventListener("click",()=>{fitMode=false;zoom=Math.min(zoom+.15,3);renderView();});
  $("zoom-out").addEventListener("click",()=>{fitMode=false;zoom=Math.max(zoom-.15,.45);renderView();});
  $("fit").addEventListener("click",()=>{fitMode=true;renderView();});
  $("toggle-thumbs").addEventListener("click",()=>{
    $("thumbs").classList.toggle("open");
    if(fitMode) renderView();
  });
  $("fullscreen").addEventListener("click",()=>{
    if(!document.fullscreenElement) $("ayce-app").requestFullscreen?.();
    else document.exitFullscreen?.();
  });
  $("print").addEventListener("click",()=>window.open(PDF_URL,"_blank","noopener"));

  let touchX=null;
  stage.addEventListener("touchstart",e=>{touchX=e.changedTouches[0].clientX;},{passive:true});
  stage.addEventListener("touchend",e=>{
    if(touchX===null) return;
    const dx=e.changedTouches[0].clientX-touchX;
    if(Math.abs(dx)>45) go(dx<0?1:-1);
    touchX=null;
  },{passive:true});

  document.addEventListener("keydown",e=>{
    if(e.target.closest("button,a,input,textarea")) return;
    if(e.key==="ArrowRight") go(1);
    if(e.key==="ArrowLeft") go(-1);
  });

  window.addEventListener("resize",()=>{
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(async()=>{
      if(!pdf||busy) return;
      const wasMobile=mobile, anchor=currentAnchorPage();
      if(wasMobile!==isMobileLayout()){
        buildViews();
        const idx=views.findIndex(v=>v.pages.includes(anchor));
        viewIndex=Math.max(0,idx);
      }
      await renderView();
    },220);
  });

  async function init(){
    try{
      const loading=pdfjs.getDocument({url:PDF_URL});
      pdf=await loading.promise;
      if(pdf.numPages!==48){
        console.warn("This viewer was configured for the uploaded 48-page program; found",pdf.numPages);
      }
      $("download").href=PDF_URL;
      buildViews();
      buildThumbs();
      await renderView();
    }catch(err){
      console.error(err);
      status.hidden=false;
      status.textContent="The program could not be loaded. Please make sure conference-program.pdf is in the same folder as index.html.";
    }
  }
  init();
})();
</script>
</body>
</html>
