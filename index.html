<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0077CC">
<title>AYCE Conference Program</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--blue:#0077CC;--purple:#5A3E9C;--yellow:#F4D35E;--ink:#333;--stage:#e9e9ed}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fafafa}
body{padding:18px 12px}#ayce-app{max-width:1180px;margin:auto}
.header{text-align:center;padding:5px 10px 18px}.header h1{margin:0;color:var(--purple);font-size:clamp(21px,3vw,31px);letter-spacing:1px}.header p{margin:6px 0 0;color:#666;font-size:12px;letter-spacing:2px;text-transform:uppercase}
.toolbar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;background:var(--blue);padding:11px;border-radius:10px 10px 0 0}
.toolbar button,.toolbar a{font:700 13px Arial,sans-serif;border:0;border-radius:5px;padding:9px 12px;background:#fff;color:var(--blue);text-decoration:none;cursor:pointer}.toolbar button:hover,.toolbar a:hover{background:var(--yellow);color:var(--ink)}.toolbar button:disabled{opacity:.4;cursor:not-allowed}.counter{color:#fff;font-size:13px;font-weight:700;min-width:104px;text-align:center}
.viewer-shell{display:flex;background:var(--stage);border:1px solid #d5d5da;min-height:430px;flex:1;min-height:0}
.thumbs{display:none;flex:0 0 142px;max-height:78vh;overflow:auto;background:#f7f7f8;border-right:1px solid #ddd;padding:9px}.thumbs.open{display:block}
.thumb{display:block;width:100%;border:2px solid transparent;background:#fff;border-radius:5px;margin:0 0 9px;padding:5px;cursor:pointer;color:#444;font-size:11px}.thumb.active{border-color:var(--purple);background:#f0ebf8}.thumb canvas{display:block;width:100%;height:auto;margin:0 auto 4px}
.stage{position:relative;flex:1;min-width:0;min-height:430px;padding:22px 12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.status{padding:42px 18px;text-align:center;color:#555;font-size:14px}.book{display:none;max-width:100%;max-height:100%}
.spread{display:flex;align-items:stretch;justify-content:center;background:#fff;box-shadow:0 5px 22px rgba(0,0,0,.2);position:relative;max-width:100%;max-height:100%}
[hidden]{display:none!important}\n.page{display:block;background:#fff;object-fit:contain;max-width:100%;height:auto}.spread.double .page{width:50%;max-width:50%}.spread.single .page{width:auto;max-width:100%;max-height:calc(78vh - 90px)}
.gutter{position:absolute;top:0;bottom:0;left:50%;width:10px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.10),rgba(255,255,255,.16),rgba(0,0,0,.10))}
.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px;background:#f5f5f5;border:1px solid #ddd;border-top:0;border-radius:0 0 10px 10px;font-size:11px}.footer strong{color:var(--purple);letter-spacing:.7px}.footer span{color:#777}
#ayce-app:fullscreen{width:100vw;height:100vh;height:100dvh;max-width:none;margin:0;padding:0;display:flex;flex-direction:column;background:#171717}\n#ayce-app:fullscreen .header{flex:0 0 auto;padding:7px 10px 9px;background:#fafafa}\n#ayce-app:fullscreen .toolbar{flex:0 0 auto;border-radius:0;padding:8px}\n#ayce-app:fullscreen .viewer-shell{flex:1;min-height:0;border:0}\n#ayce-app:fullscreen .stage{min-height:0;padding:12px}\n#ayce-app:fullscreen .spread{max-width:100%;max-height:100%}\n#ayce-app:fullscreen .page{max-height:100%}\n#ayce-app:fullscreen .footer{flex:0 0 auto;border-radius:0}\nbody:has(#ayce-app:fullscreen){padding:0;overflow:hidden}\n@media(max-width:680px){body{padding:8px 3px}.toolbar{gap:5px;padding:9px 4px}.toolbar button,.toolbar a{font-size:11px;padding:9px 8px}.counter{width:100%;order:-1}.stage{min-height:320px;padding:12px 3px}.thumbs{flex-basis:100px;padding:6px}.footer{justify-content:center;text-align:center}.spread.single .page{max-height:calc(78vh - 80px)}}
</style>
</head>
<body><div id="ayce-app">
<header class="header"><h1>AYCE CONFERENCE PROGRAM</h1><p>Community. Connection. Career.</p></header>
<nav class="toolbar" aria-label="Program controls">
<button id="toggle-thumbs" type="button">☷ Pages</button><button id="prev" type="button" disabled>← Previous</button><span class="counter" id="counter">Loading program…</span><button id="next" type="button" disabled>Next →</button>
<button id="zoom-out" type="button" title="Zoom out">−</button><button id="zoom-in" type="button" title="Zoom in">+</button><button id="fit" type="button">Fit</button><button id="fullscreen" type="button">⛶</button><a id="download" href="./conference-program.pdf" download>↓ Download</a><button id="print" type="button">Print</button>
</nav>
<div class="viewer-shell"><aside class="thumbs" id="thumbs" aria-label="Page thumbnails"></aside><main class="stage" id="stage"><div class="status" id="status">Loading the AYCE conference program…</div><div class="book" id="book"><div class="spread single" id="spread"><canvas class="page" id="left-page"></canvas><canvas class="page" id="right-page" hidden></canvas><div class="gutter" id="gutter" hidden></div></div></div></main></div>
<footer class="footer"><strong>AYCE | ASSOCIATION OF YOUTH AND CHILDREN IN EUROPE</strong><span>Explore the program at your own pace.</span></footer>
</div>
<script>
(()=>{"use strict";
const PDF_URL="./conference-program.pdf",pdfjs=window.pdfjsLib,$=id=>document.getElementById(id);
if(!pdfjs){$("status").textContent="The PDF viewer library could not load. Please refresh.";return}
pdfjs.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const stage=$("stage"),book=$("book"),spread=$("spread"),status=$("status"),left=$("left-page"),right=$("right-page"),gutter=$("gutter");
let pdf=null,views=[],viewIndex=0,mobile=false,fitMode=true,zoom=1,busy=false,resizeTimer=null;
const cache=new Map();
function isMobile(){return matchMedia("(max-width:680px)").matches}
function anchorPage(){return views[viewIndex]?.pages[0]||1}
function buildViews(anchor=1){mobile=isMobile();views=[{pages:[1],label:"1"}];if(mobile){for(let p=2;p<=47;p++)views.push({pages:[p],label:String(p)})}else{for(let p=2;p<=47;p+=2)views.push({pages:[p,p+1],label:p+"–"+(p+1)})}views.push({pages:[48],label:"48"});viewIndex=Math.max(0,views.findIndex(v=>v.pages.includes(anchor)))}
function targetBox(double){const w=Math.max(160,stage.clientWidth-30),h=Math.max(180,stage.clientHeight-30),full=!!document.fullscreenElement;const pageWidth=double?w/2:w;return {width:full?pageWidth:Math.min(pageWidth,460),height:h}}
async function renderPage(n,maxW,maxH){const page=await pdf.getPage(n),base=page.getViewport({scale:1}),scale=fitMode?Math.min(maxW/base.width,maxH/base.height,2.2):zoom;const dpr=Math.min(devicePixelRatio||1,2),vp=page.getViewport({scale}),key=[n,Math.round(vp.width),Math.round(vp.height),dpr].join(":");if(cache.has(key))return cache.get(key);
const canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.floor(vp.width*dpr));canvas.height=Math.max(1,Math.floor(vp.height*dpr));canvas.style.width=vp.width+"px";canvas.style.height=vp.height+"px";
await page.render({canvasContext:canvas.getContext("2d"),viewport:vp,transform:[dpr,0,0,dpr,0,0]}).promise;cache.set(key,canvas);if(cache.size>12){const first=cache.keys().next().value;cache.delete(first)}return canvas}
function showCanvas(target,source){target.width=source.width;target.height=source.height;target.style.width=source.style.width;target.style.height=source.style.height;target.getContext("2d").drawImage(source,0,0)}
async function renderView(){if(!pdf)return;const view=views[viewIndex],double=view.pages.length===2,box=targetBox(double);book.style.display="block";right.hidden=!double;gutter.hidden=!double;spread.className="spread "+(double?"double":"single");
const canvases=await Promise.all(view.pages.map(n=>renderPage(n,box.width,box.height)));showCanvas(left,canvases[0]);if(double)showCanvas(right,canvases[1]);
const pageW=parseFloat(canvases[0].style.width),pageH=parseFloat(canvases[0].style.height);spread.style.width=(double?pageW*2:pageW)+"px";spread.style.height=pageH+"px";book.style.width=spread.style.width;
$("counter").textContent="PAGE "+view.label+" OF 48";$("prev").disabled=viewIndex===0;$("next").disabled=viewIndex===views.length-1;status.hidden=true;updateThumbs();
preloadAdjacent()}
function preloadAdjacent(){for(const idx of [viewIndex-1,viewIndex+1]){if(idx<0||idx>=views.length)continue;const v=views[idx],box=targetBox(v.pages.length===2);v.pages.forEach(n=>renderPage(n,box.width,box.height).catch(()=>{}))}}
function updateThumbs(){document.querySelectorAll(".thumb").forEach(b=>b.classList.toggle("active",Number(b.dataset.view)===viewIndex))}
async function go(delta){if(!pdf||busy)return;const next=Math.max(0,Math.min(views.length-1,viewIndex+delta));if(next===viewIndex)return;busy=true;viewIndex=next;try{await renderView()}finally{busy=false}}
function buildThumbs(){const panel=$("thumbs");panel.replaceChildren();for(let p=1;p<=48;p++){const b=document.createElement("button");b.type="button";b.className="thumb";b.dataset.page=p;const c=document.createElement("canvas"),label=document.createElement("span");label.textContent="Page "+p;b.append(c,label);b.addEventListener("click",async()=>{if(busy)return;const idx=views.findIndex(v=>v.pages.includes(p));if(idx>=0){viewIndex=idx;await renderView()}});panel.append(b)}}
let thumbsLoaded=false;
$("toggle-thumbs").addEventListener("click",()=>{const panel=$("thumbs");panel.classList.toggle("open");if(!thumbsLoaded&&panel.classList.contains("open")){thumbsLoaded=true;[1,...Array.from({length:47},(_,i)=>i+2)].forEach(async p=>{const b=panel.querySelector('[data-page="'+p+'"]');if(!b)return;try{const c=await renderPage(p,68,100);const t=b.querySelector("canvas");showCanvas(t,c);t.style.width="100%";t.style.height="auto"}catch(e){}})}if(fitMode)renderView()});
$("prev").addEventListener("click",()=>go(-1));$("next").addEventListener("click",()=>go(1));
$("zoom-in").addEventListener("click",()=>{fitMode=false;zoom=Math.min(zoom+.15,3);cache.clear();renderView()});$("zoom-out").addEventListener("click",()=>{fitMode=false;zoom=Math.max(zoom-.15,.45);cache.clear();renderView()});$("fit").addEventListener("click",()=>{fitMode=true;cache.clear();renderView()});
$("fullscreen").addEventListener("click",()=>{if(!document.fullscreenElement)$("ayce-app").requestFullscreen?.();else document.exitFullscreen?.()});
document.addEventListener("fullscreenchange",()=>{cache.clear();setTimeout(()=>{if(pdf)renderView()},80)});$("print").addEventListener("click",()=>window.open(PDF_URL,"_blank","noopener"));
let touchX=null;stage.addEventListener("touchstart",e=>touchX=e.changedTouches[0].clientX,{passive:true});stage.addEventListener("touchend",e=>{if(touchX===null)return;const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>45)go(dx<0?1:-1);touchX=null},{passive:true});
document.addEventListener("keydown",e=>{if(e.target.closest("button,a,input,textarea"))return;if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
window.addEventListener("resize",()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(async()=>{if(!pdf||busy)return;const a=anchorPage();if(mobile!==isMobile())buildViews(a);cache.clear();await renderView()},200)});
async function init(){try{pdf=await pdfjs.getDocument({url:PDF_URL}).promise;$("download").href=PDF_URL;buildViews(1);buildThumbs();await renderView()}catch(err){console.error(err);status.hidden=false;status.textContent="The program could not be loaded. Please ensure conference-program.pdf is alongside index.html."}}
init();
})();
</script>
</body></html>
